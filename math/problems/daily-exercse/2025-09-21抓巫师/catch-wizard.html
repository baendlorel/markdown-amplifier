<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>抓巫师小游戏</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      gap: 20px;
    }

    #controls {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #controls label {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    #controls input[type="number"],
    #controls input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 1em;
      margin-top: 4px;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    #controls input:focus {
      border-color: #0078d7;
      outline: none;
    }

    #controls button {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      background: #0078d7;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 4px;
      transition: all 0.2s;
    }

    #controls button:hover {
      background: #005fa3;
    }

    #tableContainer table {
      border-collapse: collapse;
      margin-top: 8px;
    }

    #tableContainer th,
    #tableContainer td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: center;
      width: 30px;
    }

    #history {
      flex: 1;
      border: 1px solid #999;
      padding: 10px;
      background: #f9f9f9;
      overflow-y: auto;
      max-height: 400px;
      margin-bottom: 12px;
    }

    #stepsView {
      flex: 1;
      border: 1px solid #999;
      padding: 10px;
      background: #eef6fa;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.95em;
    }
  </style>
</head>

<body>
  <div id="controls">
    <div>
      <label for="inputN">列数 n:</label>
      <input type="number" id="inputN" min="2" value="3">
      <button id="btnGenerate">生成表格</button>
    </div>
    <div>
      <label for="inputOps">操作:</label>
      <input type="text" id="inputOps" placeholder="例如: 1,2;2,3">
      <button id="btnExecute">执行</button>
      <button id="btnClearHistory" style="background:#e74c3c;">清空历史</button>
    </div>
    <div style="margin-top:8px;">
      <label><input type="checkbox" id="displayRole"> 显示为“骗子/巫师”</label>
    </div>
  </div>

  <div id="tableContainer"></div>
  <div id="history"><b>操作历史</b><br></div>
  <div id="stepsView"><b>LocalStorage 步骤表</b><br></div>

  <script>
    let table, data = [];
    let currentSteps = []; // 当前轮次的步骤
    let gameStarted = false; // 游戏是否开始

    // 生成 n 行，每行是 n-1 个 0 和 1 个 1 的排列
    function generateTable(n) {
      if (!Number.isSafeInteger(n) || n < 2) {
        alert('n得是大于或等于2的正整数');
        return;
      }

      data = permute(n);

      // 重置当前轮次
      currentSteps = [{ type: 'generate', n, ops: [] }];
      gameStarted = true;

      renderTable(n);
    }


    function generatePermutations(n) {
      // 初始化数组
      const nums = [];
      for (let i = 0; i < n; i++) {
        nums.push(i);
      }

      // 存储结果
      const result = [];

      // 辅助函数，用于递归生成全排列
      function backtrack(path, options) {
        if (path.length === n) {
          result.push([...path]);
          return;
        }

        for (let i = 0; i < options.length; i++) {
          path.push(options[i]);
          const newOptions = [...options.slice(0, i), ...options.slice(i + 1)];
          backtrack(path, newOptions);
          path.pop();
        }
      }

      // 开始递归
      backtrack([], nums);

      return result;
    }

    // 全排列
    function permute(n) {
      // 所有排列: 把 1 放在每个位置，然后生成 n! 排列
      // 实际上等价于 n! 个排列，每行只有一个 1
      const firstPerm = [];
      for (let i = 0; i < n; i++) {
        const indices = new Array(n);
        indices.fill(0);
        indices[i] = 1;
        firstPerm.push(indices);
      }

      const indexPerm = generatePermutations(n);
      const result = [];
      for (const indexes of indexPerm) {
        for (const index of indexes) {
          result.push(firstPerm[index]);
        }
      }
      return result;
    }


    // 检查是否有列全为1
    function checkSuccess() {
      if (!data.length) return { success: false, successColumns: [] };

      const n = data[0].length;
      const successColumns = [];

      for (let col = 0; col < n; col++) {
        let allOnes = true;
        for (let row = 0; row < data.length; row++) {
          if (data[row][col] !== 1) {
            allOnes = false;
            break;
          }
        }
        if (allOnes) {
          successColumns.push(col);
        }
      }

      return { success: successColumns.length > 0, successColumns };
    }

    function renderTable(n) {
      const container = document.getElementById("tableContainer");
      container.innerHTML = "";
      table = document.createElement("table");

      const { success, successColumns } = checkSuccess();

      // 表头
      const thead = document.createElement("thead");
      const trh = document.createElement("tr");
      for (let i = 1; i <= n; i++) {
        const th = document.createElement("th");
        th.textContent = i;
        if (successColumns.includes(i - 1)) {
          th.style.backgroundColor = "#caffbf";
        }
        trh.appendChild(th);
      }
      thead.appendChild(trh);
      table.appendChild(thead);

      // 表体
      const showRole = getDisplayRole();
      for (let row of data) {
        const tr = document.createElement("tr");
        for (let colIndex = 0; colIndex < row.length; colIndex++) {
          const cell = row[colIndex];
          const td = document.createElement("td");
          if (showRole) {
            td.textContent = cell === 1 ? "巫师" : "骗子";
            td.style.color = cell === 1 ? "#0078d7" : "#DC143C";
            td.style.fontWeight = "bold";
          } else {
            td.textContent = cell;
            td.style.color = "#222";
            td.style.fontWeight = "normal";
          }

          // 成功列的背景色
          if (successColumns.includes(colIndex)) {
            td.style.backgroundColor = "#caffbf";
          }

          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      container.appendChild(table);

      // 显示成功信息
      if (success) {
        const successMsg = document.createElement("div");
        successMsg.style.cssText = "margin-top: 10px; padding: 8px; background: #caffbf; border-radius: 4px; font-weight: bold;";
        successMsg.textContent = `成功！第 ${successColumns.map(c => c + 1).join(', ')} 列全为巫师！`;
        container.appendChild(successMsg);
      }
    }

    function getDisplayRole() {
      return localStorage.getItem("mod2_displayRole") === "true";
    }

    function setDisplayRole(val) {
      localStorage.setItem("mod2_displayRole", val ? "true" : "false");
    }

    // 执行操作
    function executeOps(opsStr) {
      const ops = opsStr.split(";").map(x => x.trim()).filter(Boolean).map(x => {
        const [a, b] = x.split(",").map(Number);
        return [a - 1, b - 1]; // 转换为 0-based
      });

      // 克隆旧数据用于并发计算
      const oldData = data.map(r => r.slice());

      // 执行所有操作
      for (let [from, to] of ops) {
        for (let i = 0; i < data.length; i++) {
          data[i][to] = (oldData[i][to] + oldData[i][from]) % 2;
        }
      }

      // 记录步骤
      currentSteps.push({ type: 'operation', ops });

      renderTable(data[0].length);
      logHistory(ops);
    }

    function logHistory(ops) {
      const div = document.getElementById("history");
      const msg = ops.map(([a, b]) => `col${a + 1} → col${b + 1}`).join(", ");
      div.innerHTML += msg + "<br>";
    }

    // localStorage 相关
    function saveGameToHistory() {
      if (!gameStarted || currentSteps.length <= 1) {
        // 如果没开始游戏或者只有生成表格步骤，不保存
        return;
      }

      const { success } = checkSuccess();
      const gameRecord = {
        timestamp: new Date().toISOString(),
        steps: currentSteps,
        success: success
      };

      let gameHistory = JSON.parse(localStorage.getItem("mod2_gameHistory") || "[]");
      gameHistory.push(gameRecord);
      localStorage.setItem("mod2_gameHistory", JSON.stringify(gameHistory));
    }

    function clearHistory() {
      // 保存当前游戏到历史
      saveGameToHistory();

      document.getElementById("history").innerHTML = "<b>操作历史</b><br>";

      // 重置当前游戏状态
      currentSteps = [];
      gameStarted = false;

      updateGameHistoryView();
    }

    function updateGameHistoryView() {
      const div = document.getElementById("stepsView");
      let gameHistory = JSON.parse(localStorage.getItem("mod2_gameHistory") || "[]");

      let html = "<b>游戏历史记录</b><br>";

      if (gameHistory.length === 0) {
        html += "暂无历史记录";
      } else {
        gameHistory.forEach((game, idx) => {
          const date = new Date(game.timestamp).toLocaleString();
          const successText = game.success ? "✅ 成功" : "❌ 未成功";

          html += `<details style="margin-bottom: 8px;">`;
          html += `<summary style="cursor: pointer; font-weight: bold;">游戏 ${idx + 1} - ${successText} (${date})</summary>`;
          html += `<div style="margin-left: 16px; margin-top: 4px;">`;

          game.steps.forEach((step, stepIdx) => {
            if (step.type === 'generate') {
              html += `步骤${stepIdx + 1}: 生成${step.n}×${step.n}表格<br>`;
            } else if (step.type === 'operation') {
              html += `步骤${stepIdx + 1}: ${step.ops.map(([a, b]) => `col${a + 1}→col${b + 1}`).join(", ")}<br>`;
            }
          });

          html += `</div></details>`;
        });
      }

      div.innerHTML = html;
    }

    document.getElementById("btnGenerate").addEventListener("click", () => {
      // 如果当前有游戏进行中，先保存
      if (gameStarted && currentSteps.length > 1) {
        saveGameToHistory();
      }

      const n = parseInt(document.getElementById("inputN").value, 10);
      generateTable(n);
      updateGameHistoryView();
    });

    document.getElementById("btnExecute").addEventListener("click", () => {
      const opsStr = document.getElementById("inputOps").value;
      executeOps(opsStr);
    });

    document.getElementById("btnClearHistory").addEventListener("click", () => {
      clearHistory();
    });

    document.getElementById("displayRole").addEventListener("change", (e) => {
      setDisplayRole(e.target.checked);
      renderTable(data[0].length);
    });

    // 页面加载和刷新前的处理
    window.addEventListener("DOMContentLoaded", () => {
      const checked = getDisplayRole();
      document.getElementById("displayRole").checked = checked;
      generateTable(parseInt(document.getElementById("inputN").value, 10));
      updateGameHistoryView();
    });

    window.addEventListener("beforeunload", () => {
      // 页面刷新前保存当前游戏
      saveGameToHistory();
    });
  </script>
</body>

</html>
